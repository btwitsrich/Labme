<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z" fill="currentColor" opacity="0.15"/>
      <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8.5 12l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">PhishGuard</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="refresh-btn" title="Re-scan page">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0 1 10.7-3.7M14 8a6 6 0 0 1-10.7 3.7M2 4.3V8h3.7M14 11.7V8h-3.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" title="Settings">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- ── Main Scan Panel ── -->
<main id="scan-panel">
  <!-- Loading state -->
  <div id="loading-state" class="state-box">
    <div class="spinner"></div>
    <p class="state-label">Analyzing page security…</p>
    <p class="state-sub" id="loading-step">Running NLP + Vision models</p>
  </div>

  <!-- Result state -->
  <div id="result-state" class="hidden">
    <!-- Trust Score Ring -->
    <div class="score-section">
      <svg class="score-ring" viewBox="0 0 120 120" id="score-svg">
        <circle cx="60" cy="60" r="50" class="ring-bg"/>
        <circle cx="60" cy="60" r="50" class="ring-fill" id="ring-arc"
          stroke-dasharray="314"
          stroke-dashoffset="314"
          transform="rotate(-90 60 60)"/>
      </svg>
      <div class="score-center">
        <span class="score-num" id="score-num">--</span>
        <span class="score-label">Trust Score</span>
      </div>
    </div>

    <!-- Risk Badge -->
    <div class="risk-badge" id="risk-badge">
      <span class="risk-icon" id="risk-icon">●</span>
      <span class="risk-text" id="risk-text">Scanning…</span>
    </div>

    <!-- Current URL -->
    <div class="url-bar">
      <svg viewBox="0 0 14 14" fill="none" class="url-icon" id="url-lock-icon">
        <rect x="3" y="6" width="8" height="6" rx="1.2" stroke="currentColor" stroke-width="1.2"/>
        <path d="M5 6V4.5a2 2 0 1 1 4 0V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="url-text" id="url-text">Loading…</span>
    </div>

    <!-- Threat DNA (6-axis radar labels) -->
    <div class="dna-section" id="dna-section">
      <div class="dna-title">Threat DNA</div>
      <div class="dna-grid" id="dna-grid">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- LIME Explanation Cards -->
    <div class="findings-section" id="findings-section">
      <div class="findings-title">AI Findings</div>
      <div class="findings-list" id="findings-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Action buttons -->
    <div class="action-bar" id="action-bar">
      <button class="btn btn-safe" id="whitelist-btn">Trust Site</button>
      <button class="btn btn-danger" id="report-btn">Report Phishing</button>
    </div>
  </div>

  <!-- Error state -->
  <div id="error-state" class="state-box hidden">
    <div class="error-icon">⚠</div>
    <p class="state-label">Could not scan this page</p>
    <p class="state-sub" id="error-msg">Extension pages and local files cannot be scanned.</p>
  </div>
</main>

<!-- ── History Panel ── -->
<div id="history-panel" class="hidden">
  <div class="panel-header">
    <span>Scan History</span>
    <button class="text-btn" id="clear-history-btn">Clear</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- ── Bottom Nav ── -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-scan" data-panel="scan">
    <svg viewBox="0 0 16 16" fill="none"><path d="M8 2L2 5v4c0 3 2.5 5.7 6 6.5C11.5 14.7 14 12 14 9V5L8 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <span>Scan</span>
  </button>
  <button class="nav-btn" id="nav-history" data-panel="history">
    <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span>History</span>
  </button>
</nav>

<script src="popup.js"></script>
</body>
</html>
